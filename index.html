<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bras Conect</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0a0d1a" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  </head>
  <body>
    <div id="splash" style="position:fixed;inset:0;background:#0a0d1a;display:flex;align-items:center;justify-content:center;z-index:9999;transition:opacity 0.3s">
      <div style="text-align:center">
        <div id="splash-logo" style="width:64px;height:64px;border-radius:50%;background:#151c2c;margin:0 auto 16px;overflow:hidden;display:flex;align-items:center;justify-content:center"></div>
        <p style="color:rgba(255,255,255,0.3);font-size:10px;font-weight:800;letter-spacing:0.2em;text-transform:uppercase;font-family:system-ui">Bras Conect</p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Splash: tenta carregar logo do cache
      try {
        var cachedLogo = localStorage.getItem('brasconect_logo_url');
        if (cachedLogo) {
          var img = document.createElement('img');
          img.src = cachedLogo;
          img.style.cssText = 'width:100%;height:100%;object-fit:cover';
          document.getElementById('splash-logo').appendChild(img);
        }
      } catch(e) {}
      // Remove splash quando React montar
      window.__removeSplash = function() {
        var s = document.getElementById('splash');
        if (s) { s.style.opacity = '0'; setTimeout(function() { s.remove(); }, 300); }
      };
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => console.log('Service Worker registered successfully:', reg.scope))
            .catch((err) => console.log('Service Worker registration failed:', err));
        });
      }
    </script>
  </body>
</html>
